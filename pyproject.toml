[project]
name = "eldenringtool"
version = "0.1.0"
license = "LGPL-3.0-only"
description = "Native read-only Elden Ring completion map, quest guide and collection compendium"
requires-python = ">=3.13"
dependencies = [
  "PySide6>=6.8,<7", "zstandard>=0.23", "pycryptodome>=3.20", "pillow>=10.4",
  "texture2ddecoder>=1.0"
]
[project.optional-dependencies]
experimental-surface = ["numpy>=2.0", "soulstruct==2.4.3", "soulstruct-havok==1.3.2"]
[project.scripts]
eldenringtool = "eldenringtool.app:main"
